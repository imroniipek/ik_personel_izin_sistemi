<div class="login-page">
  <div class="login-card">
    <h2>İK Yönetim Sistemi</h2>
    <p class="subtitle">Giriş yapmak için rol seçiniz</p>

    <div class="role-buttons">
      <button
        type="button"
        [class.active]="role === 'admin'"
        (click)="role = 'admin'">
        Admin
      </button>

      <button
        type="button"
        [class.active]="role === 'manager'"
        (click)="role = 'manager'">
        Manager
      </button>

      <button
        type="button"
        [class.active]="role === 'personel'"
        (click)="role = 'personel'">
        Personel
      </button>
    </div>

    <div *ngIf="role === 'admin'">
      <label>Kullanıcı Adı</label>
      <input
        type="text"
        [(ngModel)]="username"
        placeholder="Kullanıcı adı giriniz">

      <label>Şifre</label>
      <input
        type="password"
        [(ngModel)]="password"
        placeholder="Şifre giriniz">
    </div>

    <div *ngIf="role === 'personel' || role === 'manager'">
      <label>Email</label>
      <input
        type="text"
        [(ngModel)]="email"
        placeholder="ornek@halkbank.com.tr">
    </div>

    <p class="error" *ngIf="errorMessage">
      {{ errorMessage }}
    </p>

    <button
      class="login-button"
      type="button"
      (click)="login()">
      Giriş Yap
    </button>
  </div>
</div>
